{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}

<p style="margin:0 0 16px"><a href="{{ url_for('dashboard') }}">&larr; Dashboard</a></p>

<div class="card" style="max-width:480px">
  <h2>Change password &mdash; {{ user }}</h2>
  <div class="body">
    <form method="post" action="{{ url_for('account') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="text" name="username" value="{{ user }}" autocomplete="username"
             hidden aria-hidden="true">
      <label for="cur">Current password</label>
      <input id="cur" type="password" name="current" autocomplete="current-password" required>
      <label for="new" style="margin-top:14px">New password
        <span class="hint">(at least {{ min_len }} characters)</span></label>
      <input id="new" type="password" name="new" autocomplete="new-password"
             minlength="{{ min_len }}" required>
      <label for="cf" style="margin-top:14px">Confirm new password</label>
      <input id="cf" type="password" name="confirm" autocomplete="new-password"
             minlength="{{ min_len }}" required>
      <button class="btn" type="submit" style="margin-top:18px">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
