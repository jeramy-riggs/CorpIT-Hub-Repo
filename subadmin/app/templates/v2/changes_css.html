<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  .cc-head{display:flex;align-items:flex-start;gap:26px;flex-wrap:wrap;
    padding:20px 0 18px;border-bottom:1px solid var(--border)}
  .cc-head .id{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .cc-head h2{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
  .cc-head .subject{font-size:17px;font-weight:400;color:var(--ink)}
  .cc-meta{margin-left:auto;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .cc-facts{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  @media (max-width:900px){.cc-meta{margin-left:0;width:100%}}
  .cc-facts .f .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-3);margin-bottom:4px}
  .cc-facts .f .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .cc-actbar{display:flex;gap:8px;align-items:flex-start}

  /* Disclosure menu. <details> so it is keyboard-operable with no script; the
     only JS is closing it on an outside click, which markup cannot express. */
  details.menu{position:relative}
  details.menu > summary{list-style:none;cursor:pointer}
  details.menu > summary::-webkit-details-marker{display:none}
  details.menu > summary .chev{width:12px;height:12px;transition:transform .14s var(--ease-out)}
  details.menu[open] > summary .chev{transform:rotate(180deg)}
  details.menu .menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:9;min-width:238px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow-2);padding:5px;display:flex;flex-direction:column;gap:1px}
  details.menu .menu-pop button,details.menu .menu-pop a{display:flex;align-items:center;gap:9px;
    width:100%;text-align:left;background:none;border:0;font:inherit;font-size:12.5px;color:var(--ink);
    padding:8px 10px;border-radius:5px;cursor:pointer;text-decoration:none}
  details.menu .menu-pop button[disabled]{color:var(--ink-3);cursor:not-allowed}
  @media (hover:hover) and (pointer:fine){
    details.menu .menu-pop button:not([disabled]):hover,
    details.menu .menu-pop a:hover{background:var(--surface-2)}}
  details.menu .menu-pop button:focus-visible,details.menu .menu-pop a:focus-visible{
    outline:2px solid var(--accent);outline-offset:-2px}
  details.menu .menu-sep{height:1px;background:var(--border-2);margin:4px 2px}
  details.menu .menu-note{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    padding:6px 10px 8px;line-height:1.5}

  /* ---- lifecycle ---- */
  .cc-life{list-style:none;display:flex;align-items:flex-start;margin:0;padding:20px 0 22px;gap:0}
  .cc-life li{display:flex;align-items:center;gap:11px;flex:1 1 0;min-width:0}
  .cc-life li:last-child{flex:0 0 auto}
  .cc-life .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;
    border:1px solid var(--border);background:var(--surface);color:var(--ink-3)}
  .cc-life .lab{font-size:13px;color:var(--ink-3);white-space:nowrap}
  .cc-life .bar{flex:1 1 auto;height:1px;background:var(--border);margin:0 14px;min-width:18px}
  .cc-life li[data-state="done"] .dot{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
  .cc-life li[data-state="done"] .lab{color:var(--ink-2)}
  .cc-life li[data-state="current"] .dot{border-color:var(--warn);color:var(--warn);
    background:var(--warn-bg);font-weight:600}
  .cc-life li[data-state="current"] .lab{color:var(--ink);font-weight:600}
  .cc-life li[data-state="current"].ok .dot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .cc-life .stage-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .cc-life .stage-flag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 7px;border-radius:4px;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}

  /* ---- the two-column workspace ---- */
  .cc-grid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:22px;align-items:start}
  .cc-main{min-width:0}
  /* Clears the two sticky bars above it (topbar 60px + workspace bar, which
     wraps to ~100px at these widths). */
  .cc-rail{position:sticky;top:72px;display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:1180px){
    .cc-grid{grid-template-columns:minmax(0,1fr)}
    .cc-rail{position:static;top:auto}
  }

  /* ---- diff ---- */
  .cc-diff{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
    overflow:hidden;margin-bottom:16px}
  .cc-diff-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 14px;
    border-bottom:1px solid var(--border);background:var(--raise)}
  .cc-side-h{display:flex;align-items:center;gap:9px;flex:1 1 300px;min-width:0}
  .cc-side-h .t{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600}
  .cc-ver{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;padding:2px 7px;
    border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2)}
  .cc-side-h time{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
  .cc-diffsel{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:2px;gap:2px;margin-left:auto}
  .cc-diffsel button{font:inherit;font-size:12px;border:0;background:none;color:var(--ink-2);
    padding:4px 11px;border-radius:4px;cursor:pointer;transition:transform .1s var(--ease-out)}
  .cc-diffsel button:active{transform:scale(.97)}
  .cc-diffsel button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
    box-shadow:var(--shadow)}
  .cc-diffsel button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .cc-code{overflow-x:auto}
  /* Fixed layout so the two sides are always equal and the AFTER column can
     never be pushed off screen by a long path on the left. The min-width is the
     floor below which a column stops being readable: past that the region
     scrolls rather than wrapping every line into confetti. */
  table.cc-lines{width:100%;table-layout:fixed;border-collapse:collapse;
    font-family:var(--mono);font-size:11.5px;line-height:1.7;
    font-variant-numeric:tabular-nums}
  [data-cc-view="split"] table.cc-lines{min-width:880px}
  [data-cc-view="unified"] table.cc-lines{min-width:520px}
  table.cc-lines td{padding:0;border:0;vertical-align:top}
  table.cc-lines tr:last-child td{border-bottom:0}
  @media (hover:hover) and (pointer:fine){table.cc-lines tbody tr:hover{background:transparent}}
  /* The columns are sized by <colgroup>, not by the cells: under fixed layout a
     width on the first row's <td> is not what the browser reads, and every
     column came out equal - which left the source text in a 165px ribbon. */
  .cc-lines col.c-gut{width:46px}
  .cc-lines col.c-sig{width:19px}
  .cc-lines .gut{white-space:nowrap;text-align:right;padding:0 10px 0 12px;
    color:var(--ink-3);font-size:11px;user-select:none;background:var(--raise);
    border-right:1px solid var(--border-2)}
  .cc-lines .sig{padding:0 5px 0 8px;color:var(--ink-3);user-select:none;font-weight:600}
  /* pre-wrap, not pre: a 62-character certificate path is the whole point of
     this diff and must not be the thing that scrolls out of sight. The hanging
     indent puts continuation lines to the RIGHT of where a real line starts, so
     a wrapped path never reads as a new statement. */
  .cc-lines .src{padding:0 12px 0 15px;text-indent:-13px;white-space:pre-wrap;
    overflow-wrap:anywhere;color:var(--ink)}
  .cc-lines .mid{border-left:1px solid var(--border)}
  /* Unified: the row is one line, so the kind sits on the row. */
  .cc-lines tr.add .src{background:var(--add-bg)}
  .cc-lines tr.add .sig{background:var(--add-bg);color:var(--good)}
  .cc-lines tr.add .gut{background:var(--add-gut)}
  .cc-lines tr.del .src{background:var(--del-bg)}
  .cc-lines tr.del .sig{background:var(--del-bg);color:var(--crit)}
  .cc-lines tr.del .gut{background:var(--del-gut)}
  /* Split: a row holds two different lines, so the kind is per cell. */
  .cc-lines td.src.add{background:var(--add-bg)}
  .cc-lines td.sig.add{background:var(--add-bg);color:var(--good)}
  .cc-lines td.gut.add{background:var(--add-gut)}
  .cc-lines td.src.del{background:var(--del-bg)}
  .cc-lines td.sig.del{background:var(--del-bg);color:var(--crit)}
  .cc-lines td.gut.del{background:var(--del-gut)}
  /* No counterpart on this side: neutral filler, never a diff colour. */
  .cc-lines td.pad{background:var(--surface-2)}
  .cc-diff-f{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 14px;
    border-top:1px solid var(--border);background:var(--raise);
    font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .cc-diff-f .adds{color:var(--good)} .cc-diff-f .dels{color:var(--crit)}

  /* ---- blast radius ---- */
  .cc-blast{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:1px;
    background:var(--border-2);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;margin-bottom:16px;align-items:stretch}
  @media (max-width:820px){.cc-blast{grid-template-columns:1fr}}
  .cc-blast > .lab{background:var(--raise);display:flex;align-items:center;padding:14px 16px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
  .cc-blast > details{background:var(--surface)}
  .cc-blast > details > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;
    align-items:center;gap:12px}
  .cc-blast > details > summary::-webkit-details-marker{display:none}
  .cc-blast > details > summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  @media (hover:hover) and (pointer:fine){.cc-blast > details > summary:hover{background:var(--raise)}}
  .cc-blast .ico{width:22px;height:22px;color:var(--ink-3);flex:0 0 auto}
  .cc-blast summary > span{min-width:0}
  .cc-blast .v{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .cc-blast .n{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .cc-blast .chev{width:13px;height:13px;margin-left:auto;color:var(--ink-3);flex:0 0 auto;
    transition:transform .15s var(--ease-out)}
  .cc-blast details[open] .chev{transform:rotate(90deg)}
  .cc-blast .body{padding:0 16px 14px;border-top:1px solid var(--border-2);margin-top:2px}
  .cc-blast .body ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .cc-blast .body li{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
    display:flex;gap:8px;align-items:baseline}
  .cc-blast .body li .q{color:var(--ink-3)}
  .cc-blast .body p{margin:10px 0 0;font-size:12px;color:var(--ink-2);line-height:1.6}

  /* ---- rail cards ---- */
  .rail-card{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
    padding:15px 16px}
  .rail-card > h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .rail-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 11px}
  .rail-card .meter{height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:11px 0 3px}
  .rail-card .meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .rail-card .meter.none i{background:var(--ink-3)}
  .rail-card .meter.full i{background:var(--good)}

  .appr{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-2)}
  .appr:last-of-type{border-bottom:0}
  .appr .av{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
    display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:600;
    color:var(--ink-2);flex:0 0 auto}
  .appr .who{min-width:0;flex:1}
  .appr .who b{font-size:12.5px;font-weight:600;display:block}
  .appr .who small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:block;
    margin-top:2px;word-break:break-word}
  .appr .stt{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;flex:0 0 auto}
  .appr .stt svg{width:13px;height:13px}
  .appr .stt.pend{color:var(--ink-3)} .appr .stt.ok{color:var(--good)} .appr .stt.no{color:var(--crit)}

  .rail-list{display:flex;flex-direction:column}
  .rail-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-2);
    font-size:12.5px}
  .rail-row:last-of-type{border-bottom:0}
  .rail-row .t{flex:1;min-width:0}
  .rail-row .res{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
  .rail-row .res svg{width:13px;height:13px;flex:0 0 auto}
  .rail-row .res.good{color:var(--good)} .rail-row .res.crit{color:var(--crit)}
  .rail-row .res.warn{color:var(--warn)} .rail-row .res.mut{color:var(--ink-3)}
  .rail-foot{margin-top:11px;padding-top:11px;border-top:1px solid var(--border-2)}
  .linkbtn{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--accent);
    cursor:pointer;text-align:left;border-radius:3px}
  .linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (hover:hover) and (pointer:fine){.linkbtn:hover{text-decoration:underline}}

  .rail-kv{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
  .rail-kv svg{width:14px;height:14px;color:var(--ink-3);flex:0 0 auto}
  .rail-kv .k{color:var(--ink-2)}
  .rail-kv .v{margin-left:auto;font-family:var(--mono);font-size:11.5px;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .rail-card.rb h3{color:var(--crit);font-family:var(--mono);font-size:15px}
  .rail-card p.rb-note{margin:7px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}

  .cc-blockbar{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r);padding:12px 15px;
    font-size:13px;margin:0 0 16px;background:var(--crit-bg);border:1px solid var(--crit-line);color:var(--ink)}
  .cc-blockbar svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--crit)}
  .cc-blockbar b{color:var(--crit)}
  .cc-blockbar .actions{margin-left:auto}

  .cc-summary{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:15px 17px}
  .cc-summary .rail-h{margin-bottom:7px}
  .cc-summary p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.65;max-width:78ch}

  .cc-example{display:flex;gap:10px;align-items:flex-start;padding:11px 15px;border-radius:var(--r);
    background:var(--surface-2);border:1px dashed var(--border);font-size:12.5px;color:var(--ink-2);
    margin:0 0 16px;line-height:1.6}
  .cc-example svg{width:16px;height:16px;flex:0 0 auto;color:var(--ink-3);margin-top:1px}

  .chk{padding:13px 0;border-bottom:1px solid var(--border-2)}
  .chk:last-of-type{border-bottom:0}
  .chk-h{display:flex;align-items:center;gap:10px}
  .chk-h b{font-size:13px;font-weight:600;flex:1}
  .chk p{margin:7px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.6;max-width:74ch}
  .chk .ev{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:6px;word-break:break-word}
  .chk.failed{background:var(--crit-bg);margin:0 -20px;padding-left:20px;padding-right:20px;
    border-bottom-color:var(--crit-line)}

  @media (prefers-reduced-motion:reduce){
    dialog.sheet{transition:none}
    @starting-style{dialog.sheet[open]{opacity:1;transform:none}}
    .cc-blast .chev,details.menu > summary .chev{transition:none}
  }


  /* ported bits the change view still uses */
  .cc-wrap .eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
  .cc-wrap table:not(.cc-lines){width:100%;border-collapse:collapse;font-size:13px}
  .cc-wrap table:not(.cc-lines) th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 14px 8px;border-bottom:1px solid var(--border-2);font-weight:500}
  .cc-wrap table:not(.cc-lines) td{padding:11px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle}
  .cc-wrap table:not(.cc-lines) tr:last-child td{border-bottom:0}
  .cc-wrap .card{margin-bottom:16px}
</style>
