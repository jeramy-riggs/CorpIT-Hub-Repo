# corpit evidence log: one structured JSON line per request through nginx, written beside (not instead of) the existing access.log.
# Adds nothing to nginx.conf and changes no existing log: access.log, its corpit format and /opt/subdomain-admin/change_control.py (which reads the first field
# of access.log) are untouched. /var/log/nginx/*.log is already rotated daily by logrotate (rotate 14, compress), so this file is too.
# Correlation: rid is the caller's X-Request-Id when it is a sane token, else nginx's own $request_id. app_rid is the id the hub returned
# ($upstream_http_x_request_id = obs_request.request_id), so a line joins the hub's request record.
# Path only ($uri): no query string, no client address, no cookies or authorization headers are written.
# Vhosts that set their own access_log (sub-myprofile, itam-redirect) do not inherit this one.
map $http_x_request_id $ev_rid {
    "~^[A-Za-z0-9._:-]{8,64}$"  $http_x_request_id;      # quoted: an unquoted { would start a block
    default                   $request_id;
}
map $status $ev_sev {
    ~^5       error;
    ~^4       warn;
    default   info;
}
log_format evjson escape=json '{"ts":"$time_iso8601","env":"prod","node":"$hostname","source":"nginx","app":"nginx","host":"$host","severity":"$ev_sev","event":"http.request","rid":"$ev_rid","app_rid":"$upstream_http_x_request_id","method":"$request_method","page":"$uri","status":$status,"request_time_s":$request_time,"upstream_time_s":"$upstream_response_time","upstream_status":"$upstream_status","bytes":$body_bytes_sent,"protocol":"$server_protocol"}';
access_log /var/log/nginx/corpit-events.log evjson;
