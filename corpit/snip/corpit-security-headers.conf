# ITAM-004 security headers (2026-08-08). Report-only CSP; promote after violation review.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 2026-10-21: 'unsafe-eval' on the enforcing script-src: /vendor/dc-runtime.js (service-desk-portal) builds its page logic with new Function.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com; frame-ancestors 'self'; font-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://login.microsoftonline.com" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://login.microsoftonline.com" always;
