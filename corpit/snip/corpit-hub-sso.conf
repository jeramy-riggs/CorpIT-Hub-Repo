# corpit-hub-sso.conf — drop-in CorpIT Hub sign-in for any vhost on this box.
#
# USAGE, inside a server { } block:
#
#     include snippets/corpit-hub-sso.conf;
#
#     location / {
#         auth_request /_gate;
#         error_page 401 = @gate_denied;
#         error_page 403 @gate_forbidden;   # no '=': keep the 403 status      # signed in, not entitled here
#         error_page 500 502 503 504 =503 @gate_unavailable;
#         auth_request_set $gate_email $upstream_http_x_gate_email;
#         proxy_set_header X-Gate-Email $gate_email;   # only if proxying to an app
#         try_files $uri $uri/ =404;
#     }
#
# That is the whole integration. No Entra change is needed for a new vhost: only
# corpit.nrpi.local is registered as a redirect URI, and every other host gets its
# session through the audience-bound handoff in oidc-auth.js.
#
# EVERY host shows the SAME sign-in page. login.html and the two font assets it
# needs are aliased from corpit's web root below, so there is exactly one copy of
# the sign-in experience on the box. The page is host-portable by construction: it
# derives its origin from window.location and posts to a relative /api/auth/login,
# so the host it is served from is the host that gets the session.
#
# HOW A SIGN-IN FLOWS ON A NON-corpit HOST
#   1. visitor hits a gated page here with no cookie   -> 401 -> @gate_denied
#   2. @gate_denied shows THIS host's /login.html, which calls /api/auth/login on
#      THIS host, recording this host as the return origin, then goes to Entra
#   3. Entra returns to https://corpit.nrpi.local/api/auth/callback (the one
#      registered URI), which validates the id_token there
#   4. because the return origin is not corpit, the callback mints a 60-second,
#      single-use, audience-bound handoff token and sends the browser back here
#   5. /api/auth/accept on THIS host verifies it offline (both hosts share
#      RBAC_SESSION_SECRET) and sets THIS host's own cookie
#
# The session cookie is never widened to .nrpi.local. Each host holds only its own.
#
# DO NOT USE THIS ON A NON-BROWSER PATH.
# directory.nrpi.local is Radicale CardDAV: iOS/macOS Contacts authenticate with
# Basic auth and cannot follow an interactive redirect to Microsoft. Gate that
# vhost's BROWSER surface (/.web/) and leave the collection paths on Basic auth.

# nginx auth_request target. Pure HMAC verification of the it_session cookie --
# no DB, no LDAP -- so a directory outage can never lock anyone out of a page.
location = /_gate {
    internal;
    proxy_pass http://127.0.0.1:3002/api/gate/check;
    # CHG-ARCH-22 (2026-09-24): this location sets its own proxy_set_header, so the server-level
    # X-Real-IP is NOT inherited; without it every user's gate check shared the hub rate limiter's
    # single 127.0.0.1 bucket (500/min; 836 gate 429s on 2026-09-08/09).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # CHG-ARCH-12 (2026-09-23): the body never reaches the gate (proxy_pass_request_body
    # off), but nginx still checks Content-Length against THIS location's
    # client_max_body_size for the subrequest. Left at the 1m default, every gated
    # upload over 1 MB ended as "auth request unexpected status: 413" -> 500 to the
    # user, whatever cap the real location declared (12M, 50m, ...). 0 disables the
    # check here only; the destination location's own cap still governs the body read.
    client_max_body_size 0;
    proxy_set_header X-Original-URI    $request_uri;
    proxy_set_header X-Original-Method $request_method;
    # Which site is being asked for. site-access.js needs this to apply the
    # per-vhost group policy; its absence is treated as an unknown site and
    # falls back to the default policy (deny, bar super-admins).
    proxy_set_header X-Original-Host   $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout    2s;
}

# The sign-in front door. Deliberately NOT behind auth_request: these routes run
# before the visitor has any session. They are self-authenticating -- see oidc-auth.js.
# The sign-in page status line probes this. It MUST point at :3001 -- the API
# that actually serves sign-in -- because a green light sourced from any other
# process would stay green while sign-in was down, which is the whole failure
# this status line exists to prevent. Anonymous by necessity: it is read by a
# visitor who has no session yet. Returns {status,timestamp,version} only.
location = /api/health {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    proxy_pass http://127.0.0.1:3001/api/health;
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

# Break-glass sign-in, mirrored from corpit's vhost so the emergency path
# exists on EVERY host rather than corpit only.
#
# Why this is not a meaningful surface increase: all these hostnames resolve to
# the same IP and the same nginx, so anyone who can reach this vhost could
# already reach corpit.nrpi.local, where the endpoint was always anonymous.
#
# Why it is needed: the session cookie is host-only by design, so break-glass on
# corpit gets you into corpit and nowhere else. In an Entra outage you need it on
# the host you are actually trying to open.
#
# Protection is unchanged and lives in the API: password + TOTP, with lockout
# (429) after repeated failures, plus an nginx limit_req backstop that bounds
# guessing even if the in-process counter is rotated around: the breakglass zone
# (30 r/m per source IP, every method) and breakglass_login (10 r/m, POST only).
# Both are separate from the sso_auth zone /api/auth/ uses, so a sign-in page
# stuck reloading cannot lock an address out of SSO (CHG-ARCH-04, 2026-09-23).
# corpit's own block carries the same limits.
#
# The sign-in page still probes /api/breakglass/status and hides the control if
# it is not enrolled or not reachable, so this never renders a form that cannot
# submit.
# Dot-files and dot-directories are never served on any vhost; /.well-known/ stays reachable.
location ~ /\.(?!well-known/) { return 404; }

location ^~ /api/breakglass/ {
    proxy_pass http://127.0.0.1:3001/api/breakglass/;
    limit_req zone=breakglass burst=10 nodelay;
    limit_req zone=breakglass_login burst=5 nodelay;
    limit_req_status 429;
    add_header Cache-Control "no-store, private" always;
    include snippets/corpit-security-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location ^~ /api/auth/ {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    limit_req zone=sso_auth burst=20 nodelay;
    limit_req_status 429;   # not the 503 default: a throttled sign-in is not an outage
    proxy_pass http://127.0.0.1:3001/api/auth/;
    add_header Cache-Control "no-store, private" always;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ---- The one sign-in page, shared by every vhost ---------------------------
# Served from corpit's web root so there is a single copy to maintain and audit.
# Necessarily reachable without a session: it IS the thing you see when you have
# no session. It contains no data -- only the button that starts the Entra flow.
location = /login.html {
    # Per-host page from conf.d/corpit-login-page.conf (default: the shared one).
    alias $corpit_login_page;
    add_header Cache-Control "no-cache, must-revalidate" always;
    include snippets/corpit-security-headers.conf;
}

# login.html carries ZERO inline script (so the Report-Only CSP can be promoted
# to enforcing without breaking sign-in on every host at once). Its behaviour
# lives here. Same reasoning as login.html: reachable without a session because
# it IS what you get when you have none. Contains no data -- only the code that
# starts the Entra flow.
location = /login.js {
    alias /var/www/html/login.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate" always;
    include snippets/corpit-security-headers.conf;
}

# The only two assets login.html references. Scoped to exact paths so this does
# not become a general unauthenticated static handler on the host.
location = /fonts/fonts.css {
    alias /var/www/html/fonts/fonts.css;
    expires 1h;
}
location ^~ /fonts/files/ {
    # ^~ out-ranks the regex dotfile deny above, so /fonts/files/.anything was served on
    # every vhost that includes this snippet (probed 2026-09-23, CHG-ARCH-09). Restore it here.
    location ~ ^/fonts/files/(.*/)?\. { return 404; }
    alias /var/www/html/fonts/files/;
    expires 30d;
}

# The bootstrap page that completes a cross-host sign-in.
location = /auth-complete.html {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    alias /var/www/html/auth-complete.html;
    add_header Cache-Control "no-store, must-revalidate" always;
}
location = /auth-complete.js {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    alias /var/www/html/auth-complete.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Ending a session must work from every host, including from the "you are signed
# in but not entitled" page, which is shown to someone who has a valid session and
# therefore cannot be helped by sending them back to the sign-in page. Public by
# design: clearing your own cookie needs no authorization.
location = /api/gate/logout {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    proxy_pass http://127.0.0.1:3002/api/gate/logout;
    proxy_http_version 1.1;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, private" always;
    proxy_read_timeout 10s;
}

# Federated sign-out. Ends the local session AND hands the browser to Microsoft's
# logout endpoint, so signing out is not undone by login.js's silent re-auth on the
# next gated page. A top-level navigation, so it is a GET.
#
# Lives in this shared snippet on purpose: /api/gate/ reachability differs per vhost
# (reporting has a prefix block; accessportal and directory have none), so a per-vhost
# block would have to be repeated and would eventually be missed. An exact match here
# beats any prefix block a vhost defines.
#
# NOTE: corpit.nrpi.local does NOT include this snippet -- it predates it and inlines
# its own gate locations -- so it carries its own copy of this block. If you change
# this one, change that one too.
#
# Public for the same reason /api/gate/logout is: ending your own session needs no
# authorization, and it has to work when the session is already gone.
location = /api/gate/federated-logout {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    proxy_pass http://127.0.0.1:3002/api/gate/federated-logout;
    proxy_http_version 1.1;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, private" always;
    proxy_read_timeout 10s;
}

# Where can this person actually go? Read by the "no access to this site" page so
# a refusal offers a way onward instead of a dead end. Public for exactly the
# reason /api/gate/logout above is: it has to work from a host the caller is NOT
# entitled to, it still requires a valid session, and it reports only the
# caller's own access.
location = /api/gate/landing {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    proxy_pass http://127.0.0.1:3002/api/gate/landing;
    proxy_http_version 1.1;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Original-Host $host;
    add_header Cache-Control "no-store, private" always;
    proxy_read_timeout 10s;
}

# ACCESS-PASS (2026-10-09): the "you can't open this" screens and their one-press "Request access" ticket.
# Everything here must be readable by someone who is signed in but NOT entitled to this host, so none of it sits behind
# auth_request. The pages carry no data; the two API routes below verify the it_session cookie themselves and answer 401
# without one. Exact locations beat the vhosts' own /api/ prefix (which goes to :3000), so they reach the hub on :3001.
# Allowlist, not a directory: ^~ out-ranks the regex dotfile deny above, so anything not named here answers 404.
location ^~ /access-pass/ {
    return 404;
    location ~ ^/access-pass/(pass\.css|pass\.js|unavailable\.js|page-guard\.js|not-found\.js)$ {
        include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
        alias /var/www/html/access-pass/$1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
location = /access-needed.html {
    include snippets/corpit-security-headers.conf;   # R19
    alias /var/www/html/access-needed.html;
    add_header Cache-Control "no-store, must-revalidate" always;
}
location = /api/access-request/context {
    include snippets/corpit-security-headers.conf;   # R19
    proxy_pass http://127.0.0.1:3001/api/access-request/context;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, private" always;
    proxy_read_timeout 15s;
}
location = /api/access-request/file {
    include snippets/corpit-security-headers.conf;   # R19
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:3001/api/access-request/file;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, private" always;
    proxy_read_timeout 35s;   # the hub waits up to 30s for the Help Desk to create the ticket
}

# No session: show the shared sign-in page, carrying the original target so the
# user lands where they were going. Sanitised twice on the way back --
# sanitizeReturn() in login.html and parseReturn() in oidc-auth.js.
location @gate_denied { return 302 /login.html?return=$request_uri; }

# Signed in, but not in a group this site allows. This must NOT redirect to the
# sign-in page: the visitor already has a valid session, so they would sign in
# successfully and arrive right back here, forever. Terminal 403 with a way out.
location @gate_forbidden {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    internal;
    root /var/www/html;
    try_files /no-site-access.html =403;
    add_header Cache-Control "no-store, must-revalidate" always;
}

# The two assets that page needs, readable without entitlement to this site.
location = /no-site-access.js {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    alias /var/www/html/no-site-access.js;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# The API is unreachable: FAIL CLOSED. Serving gated content on a 5xx is exactly
# how the legacy-cookie hole stayed open on this platform for months.
location @gate_unavailable {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    internal;
    root /var/www/html;
    try_files /gate-unavailable.html =500;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Retry-After 15 always;
}

# ACCESS-PASS-WIRING (2026-10-10): nginx's own "no such file" on a gated site shows our page, with the 404 status kept
# (error_page without '=' keeps it). Only nginx-originated 404s reach here; an app behind proxy_pass still answers its own.
location @gate_notfound {
    include snippets/corpit-security-headers.conf;   # R19: a location-level add_header drops every server-level header, so repeat the shared set
    internal;
    root /var/www/html;
    try_files /not-found.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
}

# The sign-in page hero. Decorative only -- no data -- and anonymous for the
# same reason login.html and login.js are: it is part of what you see when you
# have no session.
location = /city-hero.jpg {
    alias /var/www/html/city-hero.jpg;
    expires 30d;
}
