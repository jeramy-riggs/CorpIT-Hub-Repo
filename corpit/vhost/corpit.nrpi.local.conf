# corpit.nrpi.local — CorpIT Hub virtual host
# Scoped 2026-09-01 to admin.html (landing) + ai-usage-credits.html + gate infra.
# Cleaned of the ITAM page footprint (dead static/beta/helpdesk blocks removed).
# Test + reload:  sudo nginx -t && sudo systemctl reload nginx
# ================================================================

# ── HTTP (port 80) — redirect all to HTTPS ─────────────────
server {
    listen 80;
    server_tokens off;
    server_name corpit.nrpi.local;
    return 301 https://corpit.nrpi.local$request_uri;
}

# ── HTTPS (port 443) ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name corpit.nrpi.local;
    root /var/www/html;
    # CORPIT-ROOT-LANDING 2026-09-03. Was 'index login.html', which served the
    # sign-in page as the directory index -- so an ALREADY-AUTHENTICATED request
    # to / passed the gate and got the sign-in page back at 200. See the
    # 'location = /' block below for the rest of the fix. Never point this at a
    # sign-in page: an authenticated request must never be answered with one.
    index index.html;

    # --- Never serve editor backups or source/db files ---------------------
    # The HTML auth gate is  (end-anchored), so a file named
    # page.html.bak-YYYYMMDD does NOT match it and fell through to the static
    # handler, serving full admin-page JS and internal data unauthenticated.
    # Placed first so it wins regex ordering. (144 such files existed.)
    location ~* [.-](bak|old|orig|save|swp|env|sql|dump)  { return 404; }
    location ~* ~$                                       { return 404; }
    location ~* [.](html|js|css)[.][^/]+$  { return 404; }
    # Dot-files and dot-directories (.git, .env, .htpasswd, editor state) are never served;
    # /.well-known/ stays reachable for ACME/CardDAV.
    location ~ /\.(?!well-known/)                        { return 404; }
    absolute_redirect off;

    ssl_certificate     /etc/ssl/subdomains/corpit.nrpi.local/fullchain.pem;
    ssl_certificate_key /etc/ssl/subdomains/corpit.nrpi.local/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 8h;

    server_tokens off;
    include snippets/corpit-security-headers.conf;

    # --- Static pages (no auth) ---
    location = /login.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        # [CORPIT-SIGNIN] 2026-09-24  corpit gets its own sign-in page (the tmux terminal);
        # /var/www/html/login.html stays the default for subadmin + directory.
        try_files /login-corpit.html =404;
    }

    # login.html carries ZERO inline script so the Report-Only CSP can be
    # promoted to enforcing without breaking sign-in on every host at once.
    # Its behaviour lives here, and is anonymous for the same reason the page
    # is: it IS what you get when you have no session. No data, only the code
    # that starts the Entra flow. NOTE: this vhost does not include
    # snippets/corpit-hub-sso.conf -- corpit inlines its own copies -- so this
    # block has to exist here as well as in the snippet.
    # The sign-in page hero. Decorative only -- no data -- and anonymous for the
    # same reason login.html/login.js are. NOTE: added here AND in
    # snippets/corpit-hub-sso.conf; this vhost does not include that snippet.
    # Status-line probe. Exact match so it beats the /api/ catch-all, which
    # proxies to :3000 (inventory). It must be :3001 -- the sign-in API -- or the
    # light would stay green while sign-in itself was down.
    location = /api/health {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        proxy_pass http://127.0.0.1:3001/api/health;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /city-hero.jpg {
        expires 30d;
        try_files $uri =404;
    }

    # [CORPIT-SIGNIN] 2026-09-24  photo behind the sign-in page; anonymous for the same
    # reason login.html is. Exact match: nothing else in the web root opens up.
    location = /signin-hero.jpg {
        expires 30d;
        try_files $uri =404;
    }
    location = /signin-hero.webp {
        expires 30d;
        try_files $uri =404;
    }

    location = /login.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }

    # --- AI Usage & Credits lives on reporting.nrpi.local (2026-09-03) ---------
    # The report's home is the reporting surface, gated on the
    # SaaS-CorpITHub-Reporting AD group rather than corpit's "any valid session".
    # It is NOT served from corpit: one copy, one audience. These 301s exist only
    # so old bookmarks of the corpit URL still land somewhere useful.
    #
    # SAFE now in a way it was not earlier today. 'return' runs in the rewrite
    # phase, before auth_request, so these fire for anonymous visitors -- which
    # is fine for a fixed "it moved" redirect that discloses nothing. The bug was
    # never these blocks: it was 'location = /' ALSO being a 'return', into this
    # path, so corpit's front door inherited the cross-host hop for everyone
    # including the signed-out. / now SERVES /admin.html and never enters here.
    # Do not turn 'location = /' back into a redirect.
    location = /ai-usage-credits.html {
        return 301 https://reporting.nrpi.local/ai-usage-credits.html;
    }
    location = /ai-usage-drill.js  { return 301 https://reporting.nrpi.local$uri; }
    location = /ai-usage-rollup.js { return 301 https://reporting.nrpi.local$uri; }

    # --- Server Health moved into the Subadmin control plane (2026-09-18) ----
    # Exact-match redirect keeps old bookmarks useful while retiring this
    # standalone URL.  /operations survives the shared sign-in round trip and
    # then enters the integrated Operations section at /console#operations.
    # The static HTML stays on disk as rollback material and as the temporary
    # source for Subadmin's deeper compatibility workspace.
    location = /server-health.html {
        return 301 https://subadmin.nrpi.local/operations;
    }

    # --- Access Control moved into Subadmin People & Access (2026-10-12) ----
    # The standalone Hub page-permission editor (and /saas-admin.html, which it
    # replaced) now lives at subadmin /console#iam/access. 302, not 301, so a
    # rollback is not defeated by cached redirects. access-admin.html stays on
    # disk as rollback material.
    location = /access-admin.html {
        return 302 https://subadmin.nrpi.local/access-control;
    }
    location = /saas-admin.html {
        return 302 https://subadmin.nrpi.local/access-control;
    }

    # --- Shared IT Command scripts: always revalidate (rollout safety) ---

    # CORPIT-GATE-STATIC  These are the client-side guts of gated pages, so they take the same
    # gate the pages do. They were readable anonymously until 2026-09-02.
    location = /rbac-client.js {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }
    location = /it-topbar.js {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }
    location = /it-depth.css {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }

    # CORPIT-GATE-STATIC  The one session watcher (SESSION-WATCH 2026-09-04),
    # shared by every gated page on every vhost. Gated exactly like
    # rbac-client.js / it-topbar.js / it-depth.css above.
    # CORPIT-GATE-STATIC  [SESSION-WATCH NGX-2 2026-09-04] the ONE session watcher,
    # shared by every gated page (reporting via symlink, subadmin via alias). Gated
    # exactly like rbac-client.js/it-topbar.js/it-depth.css above.
    location = /it-session-watch.js {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }

    # CORPIT-CACHE 2026-09-06  Every other root-level script/stylesheet (it-theme.js,
    # it-profile.js, my-profile.js, it-version.js, inventory-config.js ...) fell
    # through to 'location /' with NO Cache-Control, so Chrome's heuristic cache
    # (10% of the file's age) kept serving a pre-deploy copy for hours; only the
    # exact-match blocks above revalidated. Same gate, same headers as those
    # blocks; exact matches still win, and the deny regexes above still run first.
    location ~* ^/[^/]+\.(js|css)$ {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }

    # The ONLY asset the sign-in page itself loads, so it is the only one that
    # has to answer without a session. Exact match, not a prefix: this must not
    # become a general anonymous static handler.
    location = /fonts/fonts.css {
        expires 1h;
        try_files $uri =404;
    }

    # --- Self-hosted font binaries: versioned filenames, safe to cache long (PERF-04) ---
    location ^~ /fonts/files/ {
        # ^~ out-ranks the regex dotfile deny at the top of this server, so a dotfile
        # in this directory was served (probed 2026-09-23, CHG-ARCH-09). Restore it here.
        location ~ ^/fonts/files/(.*/)?\. { return 404; }
        expires 30d;
        try_files $uri =404;
    }


    # --- API proxies (port 3001: api-beta) ---
    # [CORPIT-HUB-SSO] the platform sign-in front door (2026-09-02).
    # Deliberately NOT behind auth_request: these routes run before the visitor has
    # any session, which is the point of them. They are self-authenticating -- see
    # oidc-auth.js. ^~ so this wins over the generic "location /" fallback.
    location ^~ /api/auth/ {
        limit_req zone=sso_auth burst=20 nodelay;
        limit_req_status 429;   # not the 503 default: a throttled sign-in is not an outage
        proxy_pass http://localhost:3001/api/auth/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ^~ so no later regex location can shadow an authentication endpoint; the
    # sub-vhost copy in snippets/corpit-hub-sso.conf has always been written so.
    # Rate limits (CHG-ARCH-04): its own bucket, separate from /api/auth/, so a
    # sign-in page stuck reloading cannot lock an address out of SSO; POSTs (the
    # password+TOTP attempt) are capped harder than the status probe.
    location ^~ /api/breakglass/ {
        proxy_pass http://localhost:3001/api/breakglass/;
        limit_req zone=breakglass burst=10 nodelay;
        limit_req zone=breakglass_login burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # RT-03 2026-08-24: public DEV sign-in disabled. On-box QA harness hits localhost:3001 directly.
    location ~* ^/api/localdev/login(/|$) { return 404; }
    location /api/localdev/ {
        proxy_pass http://localhost:3001/api/localdev/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # /api/saas-admin/ is no longer proxied here (2026-10-12): its page is gone and
    # nothing on this host calls it. The one route still used, the per-person AD
    # re-check, is reached through the subadmin vhost's exact, POST-only location.

    location /api/dlp/ {
        proxy_pass http://localhost:3001/api/dlp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location /api/files/ {
        proxy_pass http://localhost:3001/api/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SharePoint Gov retention-label scan (sp-label-routes.js). Without this the
    # path falls to the `location /api/` catch-all, which proxies to :3000.
    location /api/sharepoint-labels/ {
        proxy_pass http://localhost:3001/api/sharepoint-labels/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    # Exact-match denies are defeated by a trailing slash: "/portal-lookup/" does
    # not equal "/portal-lookup", so the request fell through to the /api/identity/
    # proxy below and reached the handler unauthenticated. Same regex form as the
    # localdev deny above, which already got this right.
    location ~* ^/api/identity/portal-lookup(/|$) { return 404; }
    location /api/identity/ {
        proxy_pass http://localhost:3001/api/identity/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/user360/ {
        proxy_pass http://localhost:3001/api/user360/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/system/ {
        proxy_pass http://localhost:3001/api/system/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Feed freshness lives on the hub API (:3001). Without this block it falls to
    # the `location /api/` catch-all, which proxies to :3000 (inventory) and has
    # no such route -- the page would silently get no freshness answer and, per
    # the client's fail-quiet rule, show no banner at all. Which is exactly the
    # false all-clear the banner exists to prevent.
    location /api/feeds/ {
        proxy_pass http://localhost:3001/api/feeds/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Observability API lives on the hub API (:3001). Without this block it falls
    # to the `location /api/` catch-all, which proxies to :3000 (inventory) and
    # has no such route -- so the dashboard 404s every panel and the client
    # beacon silently discards every report. Added 2026-09-06 with the
    # observability build.
    #
    # auth_request, unlike most :3001 prefixes here, because this prefix carries
    # a POST (/api/observe/client, the browser beacon) and because the read
    # routes describe the platform's failures. No error_page, for the same
    # reason as /api/me-patch/ above: every caller is fetch(), and a 302 would
    # reach it as HTML instead of a status it can act on.
    location /api/observe/ {
        auth_request /_gate;
        # Deliberately ABOVE the console's maximum for "Largest browser report
        # accepted" (1024 KB). nginx's 1m default sat exactly ON that maximum,
        # so an operator who set the cap to its top value would have had nginx
        # refuse the report first, with an HTML 413 the beacon cannot read. The
        # authority on this limit is obs-ingest-cap.js, which answers a JSON 413
        # and counts the rejection; this line only keeps nginx from pre-empting
        # it inside the supported range.
        client_max_body_size 2m;
        proxy_pass http://localhost:3001/api/observe/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # The hero's conditions readout lives on the hub API (:3001). Without this
    # block it falls to the `location /api/` catch-all, which proxies to :3000
    # (inventory) and has no such route -- so /api/weather answered Express's
    # "Cannot GET", weather-routes.js was never reached, and the hero rendered
    # with no location and no conditions at all. Same failure, and the same
    # remedy, as /api/feeds/ and /api/observe/ above. Added 2026-09-08.
    #
    # No auth_request: server.js already gates every /api route, and this one
    # returns nothing tenant-specific (the weather in Irvine). Prefix, not an
    # exact match, so /api/weather/ cannot slip past to the catch-all.
    location /api/weather {
        proxy_pass http://localhost:3001/api/weather;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/zscaler/ {
        proxy_pass http://localhost:3001/api/zscaler/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/zsnet/ {
        proxy_pass http://localhost:3001/api/zsnet/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/sharepoint/ {
        proxy_pass http://localhost:3001/api/sharepoint/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/rapid7/ {
        proxy_pass http://localhost:3001/api/rapid7/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
location /api/fortinet/ {
        proxy_pass http://localhost:3001/api/fortinet/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
location /api/netdiag/ {
        proxy_pass http://localhost:3001/api/netdiag/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/netswitch/ {
        proxy_pass http://localhost:3001/api/netswitch/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Read-only switch / firewall configuration review (config-review.html).
    # Mounted on :3001; without this block the /api/ catch-all sends it to
    # :3000 and every call 404s.
    location /api/confreview/ {
        proxy_pass http://localhost:3001/api/confreview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


location /api/meraki/ {
    proxy_pass http://localhost:3001/api/meraki/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

# Per-tenant vendor probes (Okta, ZIA, Entra, Intune, IRU) - api-beta.
location /api/tenant-health/ {
    proxy_pass http://localhost:3001/api/tenant-health/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

# Vendor status-page proxy. This block was missing, so /api/service-status fell
# through to the :3000 catch-all and 404'd - which is why the Vonage row read
# "Unavailable" rather than reporting the vendor feed.
location /api/service-status {
    proxy_pass http://localhost:3001/api/service-status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

    location /api/provisioning/ {
        proxy_pass http://localhost:3001/api/provisioning/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/user-project/ {
        proxy_pass http://localhost:3001/api/user-project/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/housekeeping/ {
        proxy_pass http://localhost:3001/api/housekeeping/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/signin-watch/ {
        proxy_pass http://localhost:3001/api/signin-watch/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /api/sdp/ {
        proxy_pass http://localhost:3001/api/sdp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /api/sdops/ {
        proxy_pass http://localhost:3001/api/sdops/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /api/insights/ {
        proxy_pass http://localhost:3001/api/insights/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Live Claude Enterprise Analytics (collector -> claude_* tables -> api-beta).
    # Same audience/gate as the AI page; RBAC is enforced in-process by the router.
    location /api/claude-analytics/ {
        proxy_pass http://localhost:3001/api/claude-analytics/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location /api/sentinel/ {
        proxy_pass http://localhost:3001/api/sentinel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    # Okta tenant view (user status, MFA enrolment, application inventory).
    # Read-only; the app gates it on the helpdesk-okta page key, which is why
    # there is no auth_request here -- same as every other :3001 prefix above.
    location /api/okta/ {
        proxy_pass http://localhost:3001/api/okta/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    # Okta -> Entra CA migration workspace (ported from ITAM 2026-09-10). The app
    # gates every route on the okta-entra-migration page key; POST /refresh runs
    # the collector inline (up to 240 s), hence the long read timeout.
    location /api/oem/ {
        proxy_pass http://localhost:3001/api/oem/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    location /api/device-posture/ {
        proxy_pass http://localhost:3001/api/device-posture/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    # M-1 (2026-09-06): gated at the proxy like /hub-api/ below -- these two prefixes
    # carry state-changing POSTs (/sync-all, /scan; /sync) and were the only :3001
    # prefixes the inventory page calls WITHOUT the /hub-api/ gate in front. No
    # error_page on purpose: callers are fetch(), a 302 would reach them as HTML.
    location /api/me-patch/ {
        auth_request /_gate;
        proxy_pass http://localhost:3001/api/me-patch/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/entra/ {
        proxy_pass http://localhost:3001/api/entra/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/abm/ {
        auth_request /_gate;   # M-1: see /api/me-patch/ above
        proxy_pass http://localhost:3001/api/abm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # [CORPIT-QA 2026-09-07] Defence in depth, NOT a hole being closed: the
    # in-process blanket in server.js already 401s every /api/bugs/ path
    # (verified anonymously through nginx AND direct to :3001, GET and POST).
    # The gain here is that an anonymous 12M POST is refused at nginx instead
    # of having its body read by node first. No error_page, same reason as
    # /api/me-patch/ above: callers are fetch() and a 302 arrives as HTML.
    location /api/bugs/ {
        auth_request /_gate;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
    }


    location /api/gpo/ {
        proxy_pass http://localhost:3001/api/gpo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # RBAC Phase 1 (added 2026-05-05) -- routes /api/rbac/* to api-beta on 3001
    # MY-PROFILE (2026-09-05): self-scoped profile API on the hub API (:3001).
    # Without this block the /api/ catch-all below would send it to :3000 (inventory).
    location /api/profile/ {
        proxy_pass http://localhost:3001/api/profile/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }
    location /api/rbac/ {
        proxy_pass http://localhost:3001/api/rbac/;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # --- Profile photo proxy to api-beta (port 3001) ---
    location /api/photo {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # --- Import auth gate (proxy-layer defense) ---
    # /api/<table>/import/bulk and /import/append go through here first: the
    # same signed-session gate that protects HTML pages also gates these
    # state-changing API endpoints, and they are the only :3000 routes allowed a
    # 50m body (the API enforces both independently: rbac.requirePage then a
    # 50 MB parser on exactly these two paths, 1 MB everywhere else, CHG-ARCH-08).
    # /append was added here on 2026-09-23 (CHG-ARCH-09): it took the same bodies
    # through the /api/ catch-all with no proxy-layer gate.
    # NOTE: Regex location blocks (~/~*) are checked before plain prefix
    # matches, so this rule wins over the catch-all /api/ block below.
    location ~* ^/api/[^/]+/import/(append|bulk)/?$ {
        # 2026-08-25: was `if ($cookie_it_auth != "granted_2024") { return 401; }`.
        # That cookie is no longer issued anywhere (gate-routes.js only clears it), so
        # this gate 401'd every live session and broke bulk import in IT_Inventory_App.js.
        # Now uses the same signed-session gate as every other protected route.
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Hub API (port 3001: corpit-hub-api) -----------------------------------
    # The vendor-integration surface behind the IT Asset Console: warranty,
    # Intune Graph, Kandji, ABM, endpoint sync, cross-reference. This prefix is
    # '/beta-api' on ITAM -- the service was never a beta, the name just stuck --
    # so it does not carry the word here. The trailing slash on proxy_pass strips
    # the prefix: /hub-api/api/warranty -> 127.0.0.1:3001/api/warranty.
    #
    # Gated at the proxy as well as in-process, because this is a BROAD prefix:
    # it exposes every route :3001 serves, not one named endpoint. No error_page
    # here on purpose -- callers are fetch(), and a 302 to the sign-in page would
    # reach them as HTML that fails to parse, hiding the real 401.
    #
    # The localdev token minter is refused through this prefix outright. Written
    # as a regex covering the bare path, the trailing slash, and anything below
    # it: `location = /x { return 404; }` is defeated by `/x/`, which shipped
    # twice on ITAM (once leaking AD PII to anonymous callers).
    location ~* ^/hub-api/api/localdev(/|$) { return 404; }
    location ~* ^/hub-api/api/identity/portal-lookup(/|$) { return 404; }
    # The loopback-only relays (/internal/portal-mail, /internal/portal-lookup)
    # exist for the Access Portal's app.py on this box, which calls :3001
    # directly. Through this prefix they WERE reachable: the trailing slash
    # strips /hub-api/, so /hub-api/internal/x reached :3001 as /internal/x for
    # any signed-in caller, and at the relay the socket peer is nginx, which is
    # loopback. Refused here with the same idiom (CHG-ARCH-05, 2026-09-23).
    location ~* ^/hub-api/internal(/|$) { return 404; }

    location /hub-api/ {
        auth_request /_gate;
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-Host $host;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # --- Cert Watchtower agent check-in (port 3000) ---
    # Public by design: agents authenticate with their own bearer token inside the
    # API (API_PUBLIC + requireAgentToken), never with a session. The route parses
    # up to 5 MB of findings, so the edge allows the same; an exact match wins over
    # the 1m catch-all below (CHG-ARCH-09, 2026-09-23).
    location = /api/agents/checkin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 5m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- API proxy (port 3000: core inventory) ---
    # 1m matches the API's own default parser (CHG-ARCH-08). It was 50m, which let
    # an anonymous caller push 50 MB into nginx's body buffer (spooled to disk) and
    # on to :3000 for every path; the import routes above keep 50m behind the gate.
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }




    # --- Default fallback (existing app) ---
        # --- Catch-all HTML protection: any .html except login.html/login_sso.html (exact matches win above) ---
    # --- ITAM-01 page gate ------------------------------------------------
    # Verifies the signed it_session cookie via api-beta. The gate endpoint is pure
    # HMAC crypto with NO AD/directory lookup, so a directory outage cannot lock
    # users out (that is what broke every non-RBAC_SUPERADMINS user last time).
    # It also still accepts the legacy it_auth value (dual-accept) during rollout.
    # Cookie-migration endpoint for the ITAM-01 gate (2026-08-24): re-issues a
    # VALID it_session as a Domain=.itam.nrpi.local cookie so pre-rollout host-only
    # sessions can pass the accessportal subdomain gate. Self-authenticating (pure
    # HMAC verify inside; 401 otherwise), POST only — login.html calls it on its
    # already-signed-in short-circuit.
    # Sign out (2026-08-24): the ONLY way to actually clear the HttpOnly it_session
    # cookie. Needs its own location because the /api/ catch-all below proxies to
    # the core API on :3000, not api-beta on :3001.
    location = /api/gate/logout {
        proxy_pass http://127.0.0.1:3002/api/gate/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Federated sign-out (2026-09-03). Ends the local session AND redirects to
    # Entra's logout endpoint, so signing out is not silently undone by login.js's
    # auto re-auth on the next gated page.
    #
    # Needs its OWN block here for the same reason /api/gate/logout above does:
    # this vhost predates snippets/corpit-hub-sso.conf and does not include it, and
    # the /api/ catch-all proxies to the core API on :3000 rather than :3001. The
    # other four vhosts pick this route up from the shared snippet; corpit cannot.
    location = /api/gate/federated-logout {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        proxy_pass http://127.0.0.1:3002/api/gate/federated-logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
        proxy_read_timeout 10s;
    }

    location = /api/gate/refresh {
        proxy_pass http://127.0.0.1:3002/api/gate/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }

    # SESSION-WATCH 2026-09-04: server-driven session countdown. Exact match, NOT a
    # prefix: the /api/ catch-all at line 544 proxies to the core inventory app on
    # :3000, so without this the watcher would poll the wrong upstream. Reports only
    # the caller's own it_session - exp, iat and the 12h absolute cap.
    #
    # No auth_request, deliberately: the endpoint authenticates itself and must be
    # able to answer a JSON 401 the watcher can interpret. Gating it would turn an
    # expired session into a 302 to an HTML sign-in page for an XHR, recreating the
    # bug FIX 3 exists to kill.
    # [SESSION-WATCH NGX-1 2026-09-04] server-driven session countdown. Exact match (the
    # /api/ catch-all proxies to :3000; this must reach :3001). No auth_request: it
    # authenticates itself and must answer a JSON 401 the watcher can read.
    location = /api/gate/session-info {
        proxy_pass http://127.0.0.1:3002/api/gate/session-info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, private" always;
        include snippets/corpit-security-headers.conf;
        proxy_read_timeout 10s;
    }

    proxy_hide_header X-Powered-By;
    location = /_gate {
        internal;
        proxy_pass http://127.0.0.1:3002/api/gate/check;
        # CHG-ARCH-22 (2026-09-24): this location sets its own proxy_set_header, so the server-level
        # X-Real-IP is NOT inherited; without it every user's gate check shared the hub rate limiter's
        # single 127.0.0.1 bucket (500/min; 836 gate 429s on 2026-09-08/09).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # CHG-ARCH-12 (2026-09-23): the body never reaches the gate (proxy_pass_request_body
        # off), but nginx still checks Content-Length against THIS location's
        # client_max_body_size for the subrequest. Left at the 1m default, every gated
        # upload over 1 MB ended as "auth request unexpected status: 413" -> 500 to the
        # user, whatever cap the real location declared (12M, 50m, ...). 0 disables the
        # check here only; the destination location's own cap still governs the body read.
        client_max_body_size 0;
        proxy_set_header X-Original-URI $request_uri;
        # CORPIT-SITE-AUTHZ  which site is being asked for; site-access.js needs it.
        proxy_set_header X-Original-Host $host;
        # Lets /check refuse a mutating request carrying a read-only QA token.
        # Its absence fails closed (such a token is denied outright), so removing
        # this line degrades QA reach, never write protection.
        proxy_set_header X-Original-Method $request_method;
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
    }
    # Where can this person actually go? Read by the "no access to this site" page
    # so a refusal offers a way onward instead of a dead end. Public for exactly
    # the reason /api/gate/logout is: it has to work from a host the caller is
    # NOT entitled to, it still requires a valid session, and it reports only the
    # caller's own access.
    location = /api/gate/landing {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        proxy_pass http://127.0.0.1:3002/api/gate/landing;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Original-Host $host;
        add_header Cache-Control "no-store, private" always;
        proxy_read_timeout 10s;
    }

    # ACCESS-PASS (2026-10-09): the "you can't open this" screens and their one-press "Request access" ticket.
    # NOTE: this vhost does not include snippets/corpit-hub-sso.conf, so the same locations exist there too. Keep them
    # in step. Public on purpose (the person was just refused): the pages carry no data and the two API routes verify
    # the it_session cookie themselves. Exact locations beat the /api/ catch-all (:3000) so they reach the hub on :3001.
    # Allowlist, not a directory: ^~ out-ranks the deny regexes at the top of this server, so anything not named
    # here answers 404.
    location ^~ /access-pass/ {
        return 404;
        location ~ ^/access-pass/(pass\.css|pass\.js|unavailable\.js|page-guard\.js|not-found\.js)$ {
            # add_header above replaces the inherited set; re-add the security headers.
            include snippets/corpit-security-headers.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }
    }
    location = /access-needed.html {
        include snippets/corpit-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /api/access-request/context {
        include snippets/corpit-security-headers.conf;
        proxy_pass http://127.0.0.1:3001/api/access-request/context;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
        proxy_read_timeout 15s;
    }
    location = /api/access-request/file {
        include snippets/corpit-security-headers.conf;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3001/api/access-request/file;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
        proxy_read_timeout 35s;   # the hub waits up to 30s for the Help Desk to create the ticket
    }

    # [CORPIT-HUB-SSO] carry the original target through the sign-in so the user
    # lands where they were going. Sanitised twice on the way back:
    # sanitizeReturn() in login.html and parseReturn() in oidc-auth.js.
    location @gate_denied { return 302 /login.html?return=$request_uri; }

    # Signed in, but not in a group this site allows. Terminal on purpose: this
    # visitor has a valid session, so bouncing them to the sign-in page would
    # succeed and land them right back here.
    location @gate_forbidden {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        internal;
        root /var/www/html;
        try_files /no-site-access.html =403;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /no-site-access.js {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    # api-beta unreachable: FAIL CLOSED. Until 2026-08-25 this accepted the retired
    # it_auth=granted_2024 cookie, so any api-beta 5xx (2s budget — a restart is enough)
    # re-opened every gated page to a value published in ~15 world-readable .bak copies,
    # even though gate-routes.js:32 set ACCEPT_LEGACY=false back at RT-02. Now mirrors the
    # accessportal vhost: serve the notice only, never gated content.
    location @gate_unavailable {
        # add_header above replaces the inherited set; re-add the security headers.
        include snippets/corpit-security-headers.conf;
        internal;
        root /var/www/html;
        try_files /gate-unavailable.html =500;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Retry-After 15 always;
    }

    # ACCESS-PASS-WIRING (2026-10-10): nginx's own "no such file" on this site shows our page, with the 404 status kept
    # (error_page without '=' keeps it). Only nginx-originated 404s reach here; an app behind proxy_pass still answers its own.
    location @gate_notfound {
        include snippets/corpit-security-headers.conf;
        internal;
        root /var/www/html;
        try_files /not-found.html =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # RFC 9116 disclosure contact. Must out-rank the dotfile deny below (^~ beats regex),
    # and `charset utf-8` makes the response `text/plain; charset=utf-8` (2026-08-26, PR-07).
    location ^~ /.well-known/ {
        # Out-ranking the deny also let dotfiles INSIDE this directory through
        # (/.well-known/.probe answered 200 on 2026-09-23, CHG-ARCH-09). security.txt
        # and any other plain name stay reachable; a dotfile below here does not.
        location ~ ^/\.well-known/(.*/)?\. { return 404; }
        charset utf-8;
        try_files $uri =404;
    }

    # CHG-ARCH-G20 (2026-09-25, decision G20)  The two largest pages revalidate instead of
    # re-downloading: okta-entra-migration.html (1.35 MB) and zscaler-command-center.html
    # (0.64 MB). Their Cache-Control drops no-store, so the browser keeps its copy and asks
    # again with If-None-Match / If-Modified-Since; an unchanged page answers 304 (etag is on
    # by default; gzip only weakens the ETag, and If-None-Match compares weakly). Every other
    # .html keeps the regex block below, unchanged. An exact match outranks every regex (the
    # deny regexes at the top cannot match these two names), so each block repeats the .html
    # block line for line: auth_request is not inherited, and a location-level add_header
    # replaces the server-level set. Only the Cache-Control value differs.
    location = /okta-entra-migration.html {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }
    location = /zscaler-command-center.html {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.html$ {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include snippets/corpit-security-headers.conf;
        try_files $uri =404;
    }
    # CORPIT-GATE-STATIC  Default-deny for static content. Anything not explicitly published
    # above (login.html, fonts, /.well-known) now requires a session, so a data
    # file dropped in the web root is not served to the world by accident.
    # CORPIT-ROOT-LANDING rev.3 2026-09-04. / SERVES /landing.html — the CorpIT
    # Hub landing (ported from the ITAM Operations Hub, one tile: Asset
    # Inventory). rev.2 served /admin.html, the two-link temp page; it is still
    # on disk at /admin.html and is the rollback.
    #
    # rev.1 did 'return 302 /ai-usage-credits.html'. When that page moved to
    # reporting.nrpi.local the same day it left a 301 behind, and the two
    # composed into: / -> /ai-usage-credits.html -> reporting.nrpi.local. Both
    # are 'return' directives, which run in the REWRITE phase -- before the
    # access phase where auth_request runs -- so it fired for ANONYMOUS
    # visitors too: corpit's front door threw people at another host's sign-in
    # page before they had signed in anywhere.
    #
    # Serving the file instead of redirecting removes that whole class of bug:
    # there is no second URL to go stale, and try_files runs in the CONTENT
    # phase, so auth_request genuinely applies here and the landing page is
    # never served to an anonymous visitor.
    location = / {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        include snippets/corpit-security-headers.conf;
        root /var/www/html;
        try_files /landing.html =404;
    }

    location / {
        auth_request /_gate;
        error_page 401 = @gate_denied;
        error_page 403 @gate_forbidden;   # no '=': keep the 403 status
        error_page 500 502 503 504 =503 @gate_unavailable;
        error_page 404 @gate_notfound;   # nginx's own "no such file" -> our page, status stays 404
        include snippets/corpit-security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
