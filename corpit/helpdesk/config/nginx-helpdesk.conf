# ── HelpDesk Dashboard ──────────────────────────────────────────────
# Add this location block INSIDE both existing server blocks
# (port 80 and port 443) in /etc/nginx/sites-enabled/default
#
# Proxies /helpdesk/ to the HelpDesk Dashboard on port 3002.
# The trailing slash on proxy_pass strips /helpdesk/ before forwarding.
# Static asset caching is handled by Express (maxAge: 7d, immutable).
# ────────────────────────────────────────────────────────────────────

    # HelpDesk Dashboard — all routes (API + static + SPA)
    location /helpdesk/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
