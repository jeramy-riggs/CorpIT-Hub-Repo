# /etc/nginx/sites-enabled/default
# Merged config: existing ITAM Inventory App + HelpDesk Dashboard
# ================================================================
# Backup original:  sudo cp /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak
# Deploy this file: sudo cp config/nginx-default-merged.conf /etc/nginx/sites-enabled/default
# Test + reload:    sudo nginx -t && sudo systemctl reload nginx
# ================================================================

# ── HTTP (port 80) ───────────────────────────────────────────
server {
    listen 80;
    server_name itam.nrpi.local;
    root /var/www/html;
    index login.html;

    # --- Existing ITAM Inventory App routes (unchanged) ---
    location = /login.html { try_files $uri =404; }
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~* ^/(IT_Inventory_App.*\.html)$ {
        if ($cookie_it_auth != "granted_2024") { return 302 /login.html; }
        try_files $uri =404;
    }
    location /beta-api/ {
        proxy_pass http://localhost:3001/;
        proxy_set_header Host $host;
    }

    # --- HelpDesk Dashboard (port 3002) ---
    # The trailing slash on proxy_pass strips /helpdesk/ before forwarding.
    # Static asset caching is handled by Express (maxAge: 7d, immutable).
    # Do NOT add a separate regex location for static files — nginx regex
    # locations cannot combine URI rewriting with proxy_pass, which would
    # forward /helpdesk/static/... to Express instead of /static/...
    location /helpdesk/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Default fallback (existing app) ---
    location / { try_files $uri $uri/ /login.html; }
}

# ── HTTPS (port 443) ────────────────────────────────────────
server {
    listen 443 ssl;
    server_name itam.nrpi.local;
    root /var/www/html;
    index login.html;

    ssl_certificate     /etc/ssl/certs/itam.crt;
    ssl_certificate_key /etc/ssl/private/itam.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Existing ITAM Inventory App routes (unchanged) ---
    location = /login.html { try_files $uri =404; }
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~* ^/(IT_Inventory_App.*\.html)$ {
        if ($cookie_it_auth != "granted_2024") { return 302 /login.html; }
        try_files $uri =404;
    }
    location /beta-api/ {
        proxy_pass http://localhost:3001/;
        proxy_set_header Host $host;
    }

    # --- HelpDesk Dashboard (port 3002) ---
    location /helpdesk/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Default fallback (existing app) ---
    location / { try_files $uri $uri/ /login.html; }
}
